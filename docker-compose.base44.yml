services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
      # Persist installed node_modules across container restarts without
      # baking them into the image; the bind-mount above is the live source.
      - web_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      # Platform preview-mode flag — passed through so the Lovable/Vite sandbox
      # detection can adjust host/port/strictPort behaviour when enabled.
      - BASE44_PREVIEW_MODE
      # Vite >= 6.1 appends this to its allowedHosts list so the preview proxy
      # hostname is accepted. The platform sets the value on the host.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command:
      - sh
      - -ec
      - |
        npm install -g bun --silent
        bun install --frozen-lockfile
        exec bun run dev -- --host 0.0.0.0 --port 3000
    restart: on-failure
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s

volumes:
  web_node_modules:
